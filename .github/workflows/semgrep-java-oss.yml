# Name of this GitHub Actions workflow.
name: Semgrep-oss

on:
  workflow_call:

jobs:
  buildmavenDepTree:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build with Maven
      # run: mvn --batch-mode --update-snapshots package
      run: mvn org.apache.maven.plugins:maven-dependency-plugin:3.9.0:tree -DoutputFile=maven_dep_tree.txt
    # - name: Build Dependency Tree
      # run: mvn dependency:tree -DoutputFile=maven_dep_tree.txt
    - name: Upload Dependency Tree Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mavendeptree
        path: maven_dep_tree.txt
  semgrep:
    needs: buildmavenDepTree
    name: Scan
    runs-on: ubuntu-latest
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    container:
      image: semgrep/semgrep
    steps:
    - uses: actions/checkout@v6
    - name: Download artifact from previous job
      uses: actions/download-artifact@v4
      with:
        name: mavendeptree
    - run: semgrep ci --supply-chain
